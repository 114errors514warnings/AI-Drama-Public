# AI Drama · 一键运行（含评测）
# 用法：
#   docker compose up --build            # 启动 Web 应用 → http://127.0.0.1:8008
#   docker compose run --rm app python -m backend.eval.replay   # 离线回放评测
services:
  app:
    build: .
    image: ai-drama:latest
    container_name: ai-drama
    ports:
      # 只绑定本机回环：无鉴权服务不应暴露到局域网/公网
      # 如需外部访问，请先自行加反向代理鉴权与知识库目录限制
      - "127.0.0.1:8008:8008"
    volumes:
      # 会话数据 / 角色记忆 / config.json（含 api_key）持久化到宿主机
      - ./data:/app/data
      # 知识库目录：容器内「📂 浏览」不可用，需手动填容器内路径；按需挂载你自己的知识库或示例
      # - ./examples/demo-kb:/kb:ro        # 挂载示例知识库 → 新建会话时填 /kb
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # 一次性评测任务：跑离线回放并产出 reports/replay_*.md/.json
  eval:
    build: .
    image: ai-drama:latest
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    command: ["python", "-m", "backend.eval.replay"]
    profiles: ["eval"]
